name: Build portable Windows app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Test and package (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 26
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '26'
          architecture: x64

      - name: Run checks and build portable ZIP
        run: .\gradlew.bat --no-daemon clean check portableZip

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SmoothWhirlingSlash-windows-x64
          path: build/distributions/SmoothWhirlingSlash-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish portable release
    needs: portable
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested portable ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SmoothWhirlingSlash-windows-x64
          path: release

      - name: Create release and upload ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $tags = @(gh api --paginate "repos/$env:GH_REPO/tags?per_page=100" --jq '.[].name')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = 0
          foreach ($tag in $tags) {
            if ($tag -match '^v(\d+)$') {
              $version = [Math]::Max($version, [int]$Matches[1])
            }
          }
          $releaseTag = "v$($version + 1)"
          gh release create "$releaseTag" "release/SmoothWhirlingSlash-portable.zip" --target "$env:RELEASE_COMMIT" --generate-notes --title "$releaseTag" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
